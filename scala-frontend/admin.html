<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Projeto Scala</title>
    <link rel="stylesheet" href="style-admin.css">

</head>
<body>
    <div class="container">
        <div class="box-control">
            <h1>Controle do Culto</h1>
            <p id="momento-atual"></p>
            
            <button id="btn-avancar" onclick="avancar()">Avançar momento</button>
            <br>
            <h3>Programa do Culto</h3>
            <textarea id="programa" rows="8" placeholder="Um momento por linha"></textarea>
            <button onclick="salvarCulto()">Salvar programa</button>
        </div>
    </div>


    <script src="admin.js"></script>

</body>
</html>
