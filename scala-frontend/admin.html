<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Projeto Scala</title>
    <link rel="stylesheet" href="styles/durag.css"

</head>
<body>
    <div class="container">
        <div class="box-control">
            <p class="texto">Controle do Culto</p>
            <p id="momento-atual"></p>
            
            <button class="botão" id="btn-avancar" onclick="avancar()">Avançar momento</button>
            <br>
            <h3 class="culto">Programa do Culto</h3>
            <textarea class="square" id="programa" rows="8" placeholder="Um momento por linha"></textarea>
            <button class="salvar" onclick="salvarCulto()">Salvar programa</button>
        </div>
    </div>


    <script src="admin.js"></script>

</body>
</html>
